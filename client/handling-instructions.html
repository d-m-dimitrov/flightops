<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handling Instructions · FlightOps</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"><link href="css/navigation.css" rel="stylesheet">
</head><body><main class="container py-4"><h1 class="h3">Handling Instructions</h1><p class="text-muted">Only publish verified, authorised procedures. New entries start inactive.</p><div id="notice" role="status"></div><form id="editor" class="card card-body mb-4"><input type="hidden" id="editingId"><input type="hidden" id="revision"><div class="row g-3"><div class="col-md-2"><label for="airline" class="form-label">Airline</label><input id="airline" class="form-control" placeholder="SQ" maxlength="12" required></div><div class="col-md-2"><label for="aircraftType" class="form-label">Aircraft</label><input id="aircraftType" class="form-control" value="ALL" maxlength="20" required></div><div class="col-md-2"><label for="operation" class="form-label">Operation</label><select id="operation" class="form-select"><option>ARRIVAL</option><option>DEPARTURE</option><option>TURNAROUND</option></select></div><div class="col-md-3"><label for="department" class="form-label">Department</label><select id="department" class="form-select"><option>OPERATIONS</option><option>RAMP</option><option>PASSENGER_HANDLING</option><option>SPUR</option></select></div><div class="col-md-3"><label for="role" class="form-label">Role</label><select id="role" class="form-select"><option>ALL</option><option>DISPATCH</option><option>ARRIVAL_DISPATCH</option><option>ARRIVAL_RAMP</option><option>RAMP</option><option>GATE</option><option>CHECKIN</option><option>SPUR</option></select></div><div class="col-md-3"><label for="type" class="form-label">Type</label><select id="type" class="form-select"><option value="INFO">Information</option><option value="MANDATORY">Mandatory</option><option value="CHECKLIST">Checklist</option></select></div><div class="col-md-9"><label for="title" class="form-label">Title</label><input id="title" class="form-control" maxlength="160" required></div><div class="col-12"><label for="body" class="form-label">Instruction text</label><textarea id="body" class="form-control" rows="4" maxlength="4000" required></textarea></div><div class="col-12" id="checklistEditor" hidden><label class="form-label" for="steps">Checklist steps — one action per line</label><textarea id="steps" class="form-control" rows="6" maxlength="15050" placeholder="Confirm aircraft on blocks&#10;Check chocks positioned&#10;Coordinate unloading"></textarea><div class="form-text">Each line becomes a separate checkbox on the Flight Dashboard. Maximum 50 steps.</div></div><div class="col-12"><label class="form-check-label"><input id="active" class="form-check-input me-2" type="checkbox">Active (publish)</label></div></div><div class="d-flex gap-2 mt-3"><button class="btn btn-primary" type="submit">Save instruction</button><button id="new" class="btn btn-outline-secondary" type="button">New</button></div></form><h2 class="h5">Library</h2><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Airline / aircraft</th><th>Operation / department / role</th><th>Type</th><th>Instruction</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="js/common.js"></script><script src="js/handlingInstructions.js"></script></body></html>
