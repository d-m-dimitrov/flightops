   <a

<div class="container py-3">

    <h2>

        Flight Schedules

    </h2>

    <button
        class="btn btn-primary mb-3"
        onclick="newSchedule()">

        Add Schedule

    </button>

<div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-end">
<div class="col-md-3"><label class="form-label" for="scheduleSearch">Search flight / route</label><input id="scheduleSearch" class="form-control" placeholder="SQ308, SIN, A388..."></div>
<div class="col-md-2"><label class="form-label" for="scheduleAirlineFilter">Airline</label><select id="scheduleAirlineFilter" class="form-select"><option value="">All airlines</option></select></div>
<div class="col-md-2"><label class="form-label" for="scheduleTypeFilter">Flight type</label><select id="scheduleTypeFilter" class="form-select"><option value="">All types</option><option value="PASSENGER">Passenger</option><option value="CARGO">Cargo</option><option value="FERRY">Ferry</option><option value="OTHER">Other</option></select></div>
<div class="col-md-2"><label class="form-label" for="scheduleStatusFilter">Status</label><select id="scheduleStatusFilter" class="form-select"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<div class="col-md-2"><label class="form-label" for="scheduleDateFilter">Valid on date</label><input type="date" id="scheduleDateFilter" class="form-control"></div>
<div class="col-md-1"><button id="scheduleResetFilters" class="btn btn-outline-secondary w-100" type="button">Reset</button></div>
</div><div id="scheduleCount" class="small text-muted mt-2" aria-live="polite"></div></div></div>
    <div id="scheduleList">

        Loading...

    </div>

</div>

<div class="modal fade"
     id="scheduleModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Flight Schedule

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body"><p class="small text-muted">STA/STD: London local (GMT/BST)</p><div class="mb-3"><label for="departureDayOffset">Departure day</label>
<select id="departureDayOffset" class="form-select"><option value="0">Same day</option><option value="1">+1 day(s)</option><option value="2">+2 day(s)</option><option value="3">+3 day(s)</option><option value="4">+4 day(s)</option><option value="5">+5 day(s)</option><option value="6">+6 day(s)</option><option value="7">+7 day(s)</option></select></div><div class="mb-3"><label for="scheduleOccurrence">Repeated time when clocks go back</label>
<select id="scheduleOccurrence" class="form-select"><option value="reject">Ask if time is ambiguous</option>
<option value="earlier">First occurrence (BST)</option><option value="later">Second occurrence (GMT)</option></select></div>

                <input
                    type="hidden"
                    id="scheduleId">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Airline</label>

                        <input
                            class="form-control"
                            id="airline">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Aircraft Type</label>

                        <input
                            class="form-control"
                            id="aircraftType">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Arrival Flight</label>

                        <input
                            class="form-control"
                            id="arrivalFlight">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Departure Flight</label>

                        <input
                            class="form-control"
                            id="departureFlight">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Origin</label>

                        <input
                            class="form-control"
                            id="origin">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Destination</label>

                        <input
                            class="form-control"
                            id="destination">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>STA</label>

                        <input
                            type="time"
                            class="form-control"
                            id="sta">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>STD</label>

                        <input
                            type="time"
                            class="form-control"
                            id="std">

                    </div>

                </div>

<div class="row g-3 mb-3">
<div class="col-md-6"><label for="arrivalFlightType" class="form-label">Arrival Flight Type</label><select id="arrivalFlightType" class="form-select"><option value="PASSENGER">Passenger</option><option value="CARGO">Cargo</option><option value="FERRY">Ferry</option><option value="OTHER">Other</option></select></div>
<div class="col-md-6"><label for="departureFlightType" class="form-label">Departure Flight Type</label><select id="departureFlightType" class="form-select"><option value="SAME">Same as Arrival</option><option value="PASSENGER">Passenger</option><option value="CARGO">Cargo</option><option value="FERRY">Ferry</option><option value="OTHER">Other</option></select></div>
<div class="col-md-6"><label for="serviceType" class="form-label">Service Type</label><select id="serviceType" class="form-select"><option value="SCHEDULED">Scheduled</option><option value="CHARTER">Charter</option><option value="AD_HOC">Ad-hoc</option></select></div>
<div class="col-md-6"><label class="form-label">Validity</label><div class="small text-muted">Leave both blank for ongoing schedules</div></div>
<div class="col-md-6"><label for="validFrom" class="form-label">Valid From</label><input type="date" id="validFrom" class="form-control"></div>
<div class="col-md-6"><label for="validTo" class="form-label">Valid To</label><input type="date" id="validTo" class="form-control"></div>
</div>
                <label>

                    Days Of Operation

                </label>

                <div id="daysPanel">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-primary"
                    onclick="saveSchedule()">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/operationalTime.js"></script>
<script src="js/schedules.js?v=3"></script>

</body>

</html>
