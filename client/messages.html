<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages · FlightOps</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><style>pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem;line-height:1.5}textarea{font-family:monospace}main{max-width:1000px!important}</style></head><body><main class="container py-3">
<a id="flightLink">← Flight dashboard</a><h1 class="h3 mt-3">Flight Messages</h1><p id="flightTitle"></p><p class="text-muted">Store received or prepared messages. Adding here does not transmit through SITA or update flight figures.</p><p id="status" role="status">Loading…</p>
<section id="composer" class="card mb-3" hidden><div class="card-body"><h2 class="h5">Add message</h2><form id="messageForm"><div class="row g-3"><div class="col-sm-6"><label for="type">Message type</label><select id="type" class="form-select"><option>MVT</option><option>CPM</option><option>LDM</option><option>UCM</option></select></div><div class="col-sm-6"><label for="direction">Movement</label><select id="direction" class="form-select"><option value="ARRIVAL">Arrival</option><option value="DEPARTURE">Departure</option></select></div></div><label for="text" class="mt-3">Original text</label><textarea id="text" class="form-control" rows="9" maxlength="30000" required spellcheck="false" placeholder="Paste the complete message here"></textarea><p class="small text-muted mt-2">History is retained. Add a new message for a correction.</p><button id="save" class="btn btn-primary" disabled>Add to flight</button><p id="saveStatus" class="mt-2 mb-0" role="status"></p></form></div></section>
<section><h2 class="h5">Message history</h2><div class="d-flex flex-wrap align-items-end gap-2 mb-3"><div><label for="filterType">Type</label><select id="filterType" class="form-select"><option value="">All types</option><option>MVT</option><option>CPM</option><option>LDM</option><option>UCM</option></select></div><div><label for="filterDirection">Movement</label><select id="filterDirection" class="form-select"><option value="">Both movements</option><option value="ARRIVAL">Arrival</option><option value="DEPARTURE">Departure</option></select></div><button id="refresh" class="btn btn-outline-secondary">Refresh</button></div><div id="history"></div><button id="older" class="btn btn-outline-secondary" hidden>Load older messages</button></section>
</main><script src="/socket.io/socket.io.js"></script><script src="js/common.js"></script><script src="js/messages.js"></script></body></html>
