<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172b45">
<title>Sign in · FlightOps</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{color-scheme:light}
body{min-height:100vh;background:linear-gradient(135deg,#101f35 0%,#173b5a 58%,#17617b 100%);display:grid;place-items:center;padding:24px 14px;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.login-wrap{width:100%;max-width:440px}
.brand{text-align:center;color:white;margin-bottom:24px}
.brand-mark{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:17px;background:#ffffff1d;border:1px solid #ffffff44;font-size:29px;margin-bottom:12px}
.brand h1{font-size:2rem;font-weight:750;letter-spacing:.015em;margin:0}
.brand p{margin:6px 0 0;color:#d4e3ef;font-size:.96rem}
.login-card{border:0;border-radius:18px;box-shadow:0 20px 60px #07152955;overflow:hidden}
.login-card .card-body{padding:32px}
.login-card h2{font-size:1.35rem;font-weight:700}
.form-label{font-size:.9rem;font-weight:600;color:#35465a}
.form-control{min-height:46px}
.btn-primary{min-height:46px;font-weight:600;background:#1664aa;border-color:#1664aa}
.btn-primary:hover{background:#11518b;border-color:#11518b}
.password-wrap{position:relative}
.password-wrap .form-control{padding-right:76px}
.password-wrap button{position:absolute;right:7px;top:6px;border:0;background:transparent;color:#1a5d92;padding:7px 10px;font-size:.85rem}
.footnote{text-align:center;color:#d6e5ef;font-size:.8rem;margin-top:20px}
@media(max-width:480px){.login-card .card-body{padding:24px 20px}.brand h1{font-size:1.8rem}}
</style>
</head>
<body>
<main class="login-wrap">
<header class="brand"><div class="brand-mark" aria-hidden="true">✈</div><h1>FlightOps</h1><p>Turnaround Management System</p></header>
<section class="card login-card" aria-labelledby="loginTitle"><div class="card-body">
<h2 id="loginTitle" class="mb-1">Welcome back</h2>
<p class="text-muted mb-4">Sign in to access flight operations.</p>
<form id="loginForm" novalidate>
<div id="loginError" class="alert alert-danger" role="alert" hidden></div>
<div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" autocomplete="username" inputmode="email" required placeholder="name@company.com"></div>
<div class="mb-4"><label class="form-label" for="password">Password</label><div class="password-wrap"><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required placeholder="Enter your password"><button type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">Show</button></div></div>
<button id="loginButton" class="btn btn-primary w-100" type="submit"><span id="loginSpinner" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" hidden></span><span id="loginButtonText">Sign in</span></button>
</form>
</div></section>
<p class="footnote">Authorised personnel only · FlightOps</p>
</main>
<script src="js/login.js"></script>
</body>
</html>
