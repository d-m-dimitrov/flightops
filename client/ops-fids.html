<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c2c">
<title>OPS FIDS · FlightOps</title>
<link rel="stylesheet" href="css/ops-fids.css?v=table2">
</head>
<body>
<header class="topbar">
  <a href="flights.html" class="back" title="Flight Operations">← Flights</a>
  <strong class="app-title">OPS FIDS</strong>
  <label class="compact-control"><span>Date</span><input id="date" type="date" aria-label="London operating date"></label>
  <label class="compact-control"><span>View</span><select id="mode"><option value="combined">Combined</option><option value="arrivals">Arrivals</option><option value="departures">Departures</option></select></label>
  <label class="compact-control"><span>Airline</span><select id="airline"><option value="">All</option></select></label>
  <label class="compact-control search-control"><span>Search</span><input id="search" type="search" placeholder="Flight, reg, stand, dispatcher…" aria-label="Search flights or dispatchers"></label>
  <button id="refresh" type="button" title="Refresh flight data">↻</button>
  <button id="fullscreen" type="button" title="Full screen">⛶</button>
  <span id="liveDot" class="live-dot offline" title="Live updates disconnected"></span>
  <span id="connection" class="sr-only" role="status">Connecting</span>
  <span id="lastUpdated" class="updated" aria-live="polite">—</span>
</header>
<main>
<p class="notice" id="notice" role="status" hidden></p>
<div class="table-wrap">
<table id="board" data-mode="combined">
<thead><tr>
  <th scope="col">FLIGHT</th>
  <th scope="col">A/C · REG</th>
  <th scope="col">STAND</th>
  <th scope="col" class="arrival-col">STA / ETA / ATA</th>
  <th scope="col" class="departure-col">STD / ETD / ATD</th>
  <th scope="col" class="arrival-col">ARR DISPATCHER</th>
  <th scope="col" class="departure-col">DEP DISPATCHER</th>
  <th scope="col">STATUS</th>
</tr></thead>
<tbody id="flightRows"><tr><td colspan="8" class="empty">Loading flights…</td></tr></tbody>
</table>
</div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="js/operationalTime.js"></script>
<script src="js/ops-fids.js?v=table2"></script>
</body>
</html>
