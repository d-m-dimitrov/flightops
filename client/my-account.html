<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account · FlightOps</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4" style="max-width:720px"><div class="d-flex align-items-center justify-content-between mb-4"><h1 class="h3 mb-0">My Account</h1><a class="btn btn-outline-secondary" href="flights.html">Back to Flights</a></div>
<div class="card mb-3"><div class="card-body"><h2 class="h5">Profile</h2><dl class="row mb-0"><dt class="col-sm-3">Name</dt><dd class="col-sm-9" id="profileName"></dd><dt class="col-sm-3">Email</dt><dd class="col-sm-9" id="profileEmail"></dd><dt class="col-sm-3">Department</dt><dd class="col-sm-9" id="profileDepartment"></dd><dt class="col-sm-3">Position</dt><dd class="col-sm-9" id="profilePosition"></dd></dl></div></div>
<div class="card"><div class="card-body"><h2 class="h5">Change Password</h2><p class="text-muted small">Your new password must contain at least 12 characters. After changing it, you will need to sign in again.</p><div id="message" role="alert"></div><form id="passwordForm"><label for="currentPassword" class="form-label">Current password</label><input class="form-control mb-3" type="password" id="currentPassword" autocomplete="current-password" required><label for="newPassword" class="form-label">New password</label><input class="form-control mb-3" type="password" id="newPassword" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirmPassword" class="form-label">Confirm new password</label><input class="form-control mb-3" type="password" id="confirmPassword" minlength="12" maxlength="128" autocomplete="new-password" required><button class="btn btn-primary" type="submit" id="savePassword">Change Password</button></form></div></div></main><script src="js/common.js"></script><script src="js/myAccount.js"></script></body></html>
