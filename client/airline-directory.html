<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlightOps — Airline Directory</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"><link rel="stylesheet" href="css/navigation.css"></head><body class="bg-light"><main class="container py-4"><div class="d-flex flex-wrap justify-content-between gap-2 align-items-center mb-3"><h2>Airline Directory</h2><a href="flights.html" class="btn btn-outline-secondary">← Operations</a></div><p class="text-muted">LHR airline contacts, providers and handling instructions. Unconfigured fields are intentionally blank.</p><div id="alert" class="alert alert-danger d-none"></div><div class="row g-3 mb-3"><div class="col-md-5"><label class="form-label">Airline</label><select id="airlines" class="form-select"></select></div><div class="col-md-3"><label class="form-label">IATA code</label><input id="iata" class="form-control" maxlength="3" placeholder="TK"></div><div class="col-md-4 d-flex align-items-end"><button id="open" class="btn btn-primary me-2">Open / New</button><button id="save" class="btn btn-success">Save</button></div></div><form id="form"><div class="card mb-3"><div class="card-header">Airline Details</div><div class="card-body row g-3"><div class="col-md-6"><label class="form-label">Airline name</label><input id="name" class="form-control" required></div><div class="col-md-2"><label class="form-label">ICAO</label><input id="icao" class="form-control" maxlength="4"></div><div class="col-md-2"><label class="form-label">Callsign</label><input id="callsign" class="form-control"></div><div class="col-md-2"><label class="form-label">AWB Prefix</label><input id="awbPrefix" class="form-control"></div><div class="col-12"><label class="form-label">Logo HTTPS URL</label><input id="logoUrl" class="form-control" type="url"></div><div class="col-12"><img id="logo" alt="Airline logo" style="max-height:65px;max-width:200px" hidden></div></div></div><div class="card mb-3"><div class="card-header d-flex justify-content-between">Airline Representatives <button id="addRep" type="button" class="btn btn-sm btn-outline-primary">+ Contact</button></div><div id="representatives" class="card-body"></div></div><div class="card mb-3"><div class="card-header">Ground Handling Services</div><div id="services" class="card-body"></div></div><div class="card mb-3"><div class="card-header">Handling Instructions</div><div class="card-body row g-3" id="instructions"></div></div><div class="small text-muted" id="updated"></div><button type="submit" class="btn btn-success mt-3">Save Airline</button></form></main><script src="js/common.js"></script><script src="js/airline-directory.js"></script></body></html>
