<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in → Gate · FlightOps</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/workflow.css" rel="stylesheet"></head><body><main class="container py-3">
<nav class="d-flex gap-3 mb-3"><a href="my-flights.html">← My flights</a><a id="flightLink">Flight dashboard</a></nav><h1 class="h3">Check-in → Gate</h1><p id="flightTitle"></p><p id="message" role="status">Loading…</p>
<button id="refresh" class="btn btn-outline-secondary mb-3">Reload latest</button>
<section class="card mb-3"><div class="card-body"><h2 class="h5">Latest handover</h2><div id="latest"></div><button id="receive" class="btn btn-success mt-3" hidden>I have read / received this handover</button></div></section>
<section id="sendSection" class="card mb-3" hidden><div class="card-body"><h2 class="h5">Send handover to Gate</h2><p class="small text-muted">These are handover figures. They do not overwrite the flight's passenger counters. Send a new version for corrections.</p>
<form id="sendForm"><div class="row g-3"><div class="col-sm-4"><label for="checkedIn">Checked-in passengers</label><input id="checkedIn" type="number" min="0" max="1000" required class="form-control"></div><div class="col-sm-4"><label for="infants">Infants</label><input id="infants" type="number" min="0" max="1000" required class="form-control"></div><div class="col-sm-4"><label for="bags">Checked bags</label><input id="bags" type="number" min="0" max="3000" required class="form-control"></div></div>
<label for="notes" class="mt-3">Outstanding items / special handling notes</label><textarea id="notes" maxlength="2000" rows="5" class="form-control"></textarea><button id="send" class="btn btn-primary mt-3">Send new version to Gate</button></form></div></section>
<section class="card"><div class="card-body"><h2 class="h5">Version history</h2><div id="history"></div></div></section>
</main><script src="js/common.js"></script><script src="js/handover.js"></script></body></html>
